name: Build Bulk AI IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/FUNDING.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We push back to main with the updated source.json, so we need the full
          # history to be able to push without a fast-forward error.
          fetch-depth: 0
          # Use the default GITHUB_TOKEN to push; the workflow has contents:write.
          persist-credentials: true

      - name: List available Xcode versions
        run: |
          ls -d /Applications/Xcode*.app 2>&1 || true
          echo "current selected:"
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Select newest available Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
            echo "Switched to $NEWEST"
            xcodebuild -version
            swift --version
          fi

      - name: Resolve Swift Package dependencies
        working-directory: ios
        run: |
          xcodebuild \
            -project calorietracker.xcodeproj \
            -scheme calorietracker \
            -resolvePackageDependencies

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild \
            -project calorietracker.xcodeproj \
            -scheme calorietracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Set version
        id: version
        run: |
          # Monotonically increasing, matches GitHub Actions' run_number.
          # Format keeps AltStore happy with numeric comparison.
          VERSION="1.0.${{ github.run_number }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S%z | sed 's/\([+-][0-9][0-9]\)\([0-9][0-9]\)/\1:\2/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION at $DATE"

      - name: Package .ipa (widget extension stripped, version stamped)
        id: package
        working-directory: ios
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/calorietracker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::expected .app at $APP_PATH"
            exit 1
          fi

          # Stamp the build's CFBundleShortVersionString + CFBundleVersion into
          # the .app's Info.plist so the in-app Settings "Build" row shows the
          # version we're publishing to AltStore. PlistBuddy Set fails when the
          # key is missing, so fall through to Add in that case.
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$INFO_PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$INFO_PLIST"
          echo "Stamped Info.plist with version $VERSION (build $BUILD_NUMBER):"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"

          # AltStore + free signing can't grant the entitlements the widget
          # extension uses (app groups, etc), so strip it before packaging.
          # The main app installs and runs cleanly; widgets won't appear.
          rm -rf "$APP_PATH/PlugIns"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -f BulkAI.ipa
          zip -qr BulkAI.ipa Payload

          SIZE=$(stat -f%z BulkAI.ipa 2>/dev/null || stat -c%s BulkAI.ipa)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          ls -lh BulkAI.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Build ${{ steps.version.outputs.version }}
          body: |
            Automated build of Bulk AI for AltStore sideloading.

            * Commit: ${{ github.sha }}
            * Built: ${{ steps.version.outputs.date }}
            * Run: ${{ github.run_number }}

            Add this source URL to AltStore on your phone:
            `https://${{ github.repository_owner }}.github.io/food/source.json`
          files: ios/BulkAI.ipa
          make_latest: 'true'

      - name: Update AltStore source.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
          SIZE: ${{ steps.package.outputs.size }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          python3 .github/scripts/update_source.py

      - name: Commit source.json bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source.json
          if git diff --cached --quiet; then
            echo "No source.json change to commit"
            exit 0
          fi
          git commit -m "ci: bump source.json to v${{ steps.version.outputs.version }} [skip ci]"
          # Retry-with-rebase loop. If two pushes to main race, the second
          # workflow's source.json bump can get rejected because main moved
          # while we were building. Fetch + rebase + push tries to land the
          # bump cleanly. Up to 5 attempts.
          for attempt in 1 2 3 4 5; do
            if git push 2>&1 | tee /tmp/push.log; then
              echo "Pushed source.json bump (attempt $attempt)"
              exit 0
            fi
            if grep -q "rejected" /tmp/push.log; then
              echo "Push rejected on attempt $attempt; rebasing on origin/main"
              git fetch origin main
              git rebase origin/main || git rebase --abort
              sleep $((attempt * 2))
            else
              echo "Push failed for a non-race reason; aborting"
              exit 1
            fi
          done
          echo "::error::source.json push still rejected after 5 retries"
          exit 1
